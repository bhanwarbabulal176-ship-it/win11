name: Windows Remote PC

on:
  workflow_dispatch:

jobs:
  remote-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

          Write-Host "Remote Desktop enabled."

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Set-LocalUser `
                -Name "RDP" `
                -Password $SecurePassword
          }
          else {
              New-LocalUser `
                -Name "RDP" `
                -Password $SecurePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires
          }

          $groups = @(
              "Administrators",
              "Remote Desktop Users"
          )

          foreach ($group in $groups) {
              try {
                  Add-LocalGroupMember `
                    -Group $group `
                    -Member "RDP" `
                    -ErrorAction Stop
              }
              catch {
                  Write-Host "RDP user is already in $group or membership exists."
              }
          }

          Write-Host "RDP account ready."

      - name: Install Tailscale
        shell: powershell
        run: |
          $Installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $Installer

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$Installer`" /quiet /norestart" `
            -Wait

          Remove-Item $Installer -Force

          Write-Host "Tailscale installed."

      - name: Connect to Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY secret is missing."
          }

          $TS = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $TS up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="github-pc-$env:GITHUB_RUN_ID"

          $IP = $null

          for ($i = 0; $i -lt 20; $i++) {

              $IP = (& $TS ip -4 |
                    Select-Object -First 1)

              if ($IP) {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $IP) {
              throw "Could not obtain Tailscale IP."
          }

          "TAILSCALE_IP=$IP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=================================="
          Write-Host "       REMOTE PC READY"
          Write-Host "=================================="
          Write-Host "IP       : $IP"
          Write-Host "Username : RDP"
          Write-Host "Password : Your RDP_PASSWORD secret"
          Write-Host "=================================="

      - name: Verify RDP
        shell: powershell
        run: |
          $Result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $Result.TcpTestSucceeded) {
              throw "RDP connection test failed."
          }

          Write-Host "RDP port 3389 is accessible."

      - name: Keep Remote PC Running
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host " Remote Windows machine is running"
          Write-Host " Tailscale IP : $env:TAILSCALE_IP"
          Write-Host " Username     : RDP"
          Write-Host " Max runtime  : 6 hours"
          Write-Host "======================================"

          while ($true) {
              Write-Host "[$(Get-Date)] Remote PC active"
              Start-Sleep -Seconds 300
          }
